services:
  mysql:
    mem_limit: 768m
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  qdrant:
    mem_limit: 384m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  backend:
    image: camp-agent-java:20261109
    pull_policy: never
    entrypoint: ["java", "-Xms128m", "-Xmx512m", "-jar", "/app/camp-agent.jar"]
    command: []
    volumes: ["../runtime/camp-agent.jar:/app/camp-agent.jar:ro"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  web:
    image: camp-agent-web-runtime:20261109
    pull_policy: never
    volumes:
      - ../runtime/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
