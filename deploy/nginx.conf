limit_req_zone $binary_remote_addr zone=camp_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=camp_chat:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 11m;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 12 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 429 '{"message":"请求过于频繁，请稍后重试"}';
    }
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /api/auth/login { limit_req zone=camp_login burst=5 nodelay; proxy_pass http://backend:8081; proxy_set_header Host $host; }
    location = /api/chat { limit_req zone=camp_chat burst=3 nodelay; proxy_read_timeout 240s; proxy_pass http://backend:8081; }
    location /api/ { proxy_read_timeout 240s; proxy_pass http://backend:8081; }
    location / { try_files $uri $uri/ /index.html; }
}

